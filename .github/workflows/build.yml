name: Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-docker-image:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # Temporarily disabled.
          # - platform: linux/arm64
          #   arch: arm64
          #   runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: ./app/dashboard
        run: npm ci

      - name: Build project
        working-directory: ./app/dashboard
        run: VITE_BASE_API=/api/ npm run build --if-present -- --outDir build --assetsDir statics

      - name: Create 404.html
        working-directory: ./app/dashboard
        run: cp ./build/index.html ./build/404.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: marzban-local:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/marzban-linux-${{ matrix.arch }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress Docker image
        run: gzip -9 /tmp/marzban-linux-${{ matrix.arch }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/marzban-linux-${{ matrix.arch }}.tar.gz
          archive: false

  publish-release:
    name: Publish release assets
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: marzban-linux-*.tar.gz
          path: dist
          merge-multiple: true

      - name: Create release and upload images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
